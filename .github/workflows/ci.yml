name: CI for CV
on:
  push:
    branches:
      - main
    paths:
      - 'data-driven-cv.Rmd'
      - 'data/**'
      - 'profile.jpeg'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Render CV
    runs-on: ubuntu-latest
    container:
      image: mlampros/mycvitae:rstudiodev
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v3

      - name: Installing texlive
        run: |
          sudo apt-get -y update
          sudo apt-get install -y texlive-base texlive-latex-base
          sudo apt-get install -y texlive-latex-recommended
          sudo apt-get install -y texlive-xetex
          sudo apt-get install -y texlive-fonts-extra

      - name: Render the resumes
        run: |
          Rscript -e "rmarkdown::render(input = file.path(getwd(), 'data-driven-cv.Rmd'), params = list(work_dir = getwd()))"

      - name: Commit files
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data-driven-cv.pdf
          git diff --staged --quiet || git commit -m "ci: rebuild CV PDF"
          git push
